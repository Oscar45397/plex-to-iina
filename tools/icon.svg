<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of the app and extension icons. Rendered to PNG with Quick Look (qlmanage -t -s 1024), cut out with a mask of the rounded square, moved up 12 px over a soft shadow, then scaled with ImageMagick to every size. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a42"/>
      <stop offset="1" stop-color="#14171a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc63d"/>
      <stop offset="1" stop-color="#e08a00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- A monitor showing a play symbol: Plex, played on this Mac. -->
  <rect x="222" y="262" width="580" height="390" rx="48" fill="none" stroke="url(#amber)" stroke-width="48"/>
  <path d="M470 380 L470 534 L602 457 Z" fill="url(#amber)" stroke="url(#amber)" stroke-width="44" stroke-linejoin="round"/>
  <path d="M472 676 L552 676 L572 760 L452 760 Z" fill="#e9a21a"/>
  <rect x="372" y="744" width="280" height="44" rx="22" fill="#e39300"/>
</svg>
